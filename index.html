<title>Daily list of Incoming Inspection</title>

<style>
/* Layout: แถบบนติดหน้าจอ (ชื่อ + รอบ + แท็บ) → พื้นที่งานเต็มความกว้าง; ตารางเลื่อนในกรอบของตัวเอง หัวตารางและคอลัมน์ Batch/Name/Type ค้างไว้ */
:root{

:root[data-theme="dark"]{

</style>

<div class="top" id="top">

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script>/* ===== Core: กติกาแจกเป้า (pure functions, ไม่แตะ DOM) ===== */
const Core = (() => {
  const DEFAULT_CFG = {
    appCap: 10,            // Appearance สูงสุดต่อคนต่อรอบ
    omiCap: 7,             // คนที่ได้ OMI เหลือสูงสุดกี่ตัว
    omiBrands: ['OMI'],
    omiTypes: [],          // Type ที่ต้องตรวจในคิว OMI (ว่าง = ทุก Type ของแบรนด์ OMI)
    elfBrands: ['ELF'],
    fullPolicy: 'swap',
    sslMaxPeople: 4, sslPerPerson: 3,
    g2Types: ['STK', 'DISPLAY', 'CARD', 'TAMPER SEAL', 'PAPER', 'LABEL'], // กลุ่ม 2: Dimension = คนเดียวกับ Appearance, Function = ผู้ตรวจ Function กลุ่ม 2
    g3Types: ['BOX', 'PARTITION'],                                         // กลุ่ม 3: Dimension / Function = คนเดียวกับ Appearance (กลุ่ม 1 = Type อื่นทั้งหมด)
    countP5ToCap: false,   // เป้า Phase 5 ทั้ง 3 part นับรวมในโควตา Appearance ของ approver หรือไม่
    dfSkip5: false,        // Dim/Func ที่ Phase 5 (แต่ไม่ใช่ 5 ทั้ง 3 part) ให้ใส่ "-" หรือไม่
  };

  const pad = n => String(n).padStart(2, '0');
  const s = v => (v === null || v === undefined ? '' : String(v).trim());
  let _uid = 0;
  const newId = () => Date.now().toString(36) + (++_uid).toString(36) + Math.random().toString(36).slice(2, 5);

  /* ---------- type pk ---------- */
  function typePk(name) {
    const raw = s(name);
    if (!raw.includes(';')) return '';
    const t = raw.split(';').pop().toUpperCase().trim();
    if (!t) return '';
    if (/TAMPER|TEMPER|TEM SEAL/.test(t)) return 'TAMPER SEAL';
    if (/PARTITION|(^|[^A-Z])(S|L|H|SHORT|LONG)[- ]?PAR/.test(t) || /^PAR/.test(t)) return 'PARTITION';
    if (/^DIS/.test(t)) return 'DISPLAY';
    if (/CARD/.test(t)) return 'CARD';
    if (/PAPER/.test(t)) return 'PAPER';
    if (/^STK|STICKER|^STK/.test(t)) return 'STK';
    if (/BOX/.test(t)) return 'BOX';
    const m = t.match(/[A-Z฿-๿]+/);
    let c = m ? m[0] : t;
    if (/^TUB/.test(c) && c !== 'TUB') c = 'TUBE';
    if (/^BOT/.test(c)) c = 'BOTTLE';
    if (c === 'SHR') c = 'SHRINK';
    return c;
  }

  /* ---------- build / pack ---------- */
  function buildOf(pack) {
    const m = s(pack).match(/([A-Za-z]+\.?\d*)\s*(\(.*\))?\s*$/);
    return m ? m[1].toUpperCase() : '';
  }
  const isSSL = pack => /SSL/i.test(s(pack));
  const isPT = pack => /(^|[^A-Za-z])PT([^A-Za-z]|$)/i.test(s(pack));

  /* ---------- phase ---------- */
  function parsePhase(txt) {
    const t = s(txt);
    if (!t || t === '#N/A') return { raw: '', n: NaN, rv: false };
    const m = t.match(/^(\d)\s*(\(RV\))?/i);
    return { raw: t, n: m ? +m[1] : NaN, rv: !!(m && m[2]) };
  }
  function phaseRank(p) {
    if (isNaN(p.n)) return 9;
    if (p.n === 1) return p.rv ? 2 : 1;
    if (p.n === 2) return 3;
    if (p.n === 3) return 4;
    if (p.n === 4) return 5;
    if (p.n === 5) return 6;
    return 7; // 0
  }

  /* ---------- วันที่ ---------- */
  function parseDate(v) {
    if (v instanceof Date) { const d = new Date(v.getTime() + 12 * 3600e3); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; }
    const t = s(v);
    let m = t.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})/);
    if (m) return `${m[3]}-${pad(m[2])}-${pad(m[1])}`;
    m = t.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) return `${m[1]}-${m[2]}-${m[3]}`;
    return '';
  }
  const dmy = iso => (iso ? `${iso.slice(8, 10)}/${iso.slice(5, 7)}/${iso.slice(0, 4)}` : '');
  const dm = iso => (iso ? `${+iso.slice(8, 10)}/${+iso.slice(5, 7)}` : '');
  function addDays(iso, n) {
    const d = new Date(iso + 'T12:00:00Z');
    d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0, 10);
  }
  function nextWorkday(iso) {
    let d = addDays(iso, 1);
    for (;;) {
      const w = new Date(d + 'T12:00:00Z').getUTCDay();
      if (w !== 0 && w !== 6) return d;
      d = addDays(d, 1);
    }
  }
  const sessKey = (date, half) => `${date}|${half === 'เช้า' ? 0 : 1}`;
  function nextSession(date, half) {
    return half === 'เช้า' ? { date, half: 'บ่าย' } : { date: nextWorkday(date), half: 'เช้า' };
  }

  /* ---------- อ่านไฟล์ Export ---------- */
  const intQty = v => { const t = String(v ?? '').replace(/,/g, '').trim(); return (t === '' || isNaN(Number(t))) ? t : String(Math.round(Number(t))); };
  function parseExport(aoa) {
    let hi = aoa.findIndex(r => r && r.some(c => s(c) === 'Batch') && r.some(c => s(c) === 'Material'));
    if (hi < 0) throw new Error('ไม่พบหัวตาราง Batch / Material ในไฟล์ Export');
    const head = aoa[hi].map(s);
    const col = n => head.indexOf(n);
    const C = {
      created: col('Create on'), batch: col('Batch'), pk: col('Material'), name: col('Short text Insp. obj'),
      po: col('Purchase Order'), qty: col('Act. lot qty'), pack: col('Mat. Doc Text'), vname: col('Vendor Name'),
      mrp: col('Doc.Ch.No.'), mvt: head.findIndex(h => /movement|^mvt$|mvmt/i.test(h)), vno: col('Vendor') >= 0 ? col('Vendor') : head.findIndex(h => /^vendor\s*(no\.?|number|code|acc)/i.test(h)), country: col('Vendor Country'), lt: col('Long-Term Char.'),
    };
    const items = [];
    for (let i = hi + 1; i < aoa.length; i++) {
      const r = aoa[i];
      if (!r) continue;
      const g = k => (C[k] >= 0 ? s(r[C[k]]) : '');
      const batch = g('batch');
      if (!batch) continue;
      items.push({
        batch, mvt: g('mvt'), pk: g('pk'), name: g('name'), po: g('po'), qty: intQty(g('qty')), pack: g('pack'),
        vname: g('vname'), vno: g('vno'), country: g('country'), mrpExport: g('mrp'),
        lt: g('lt'), created: parseDate(C.created >= 0 ? r[C.created] : ''),
        urgent: '', remark: '', mrpManual: '',
      });
    }
    return items;
  }

  /* ---------- กรองซ้ำ + PT ---------- */
  function filterNew(items, knownBatches) {
    const seen = new Set(knownBatches);
    const keep = [], dup = [], pt = [];
    for (const it of items) {
      if (seen.has(it.batch)) { dup.push(it); continue; }
      if (isPT(it.pack)) { pt.push(it); continue; }
      seen.add(it.batch);
      keep.push(it);
    }
    return { keep, dup, pt };
  }

  /* ---------- เติม MRP / Phase / Halal ---------- */
  function enrich(it, master) {
    const m = master.pk[it.pk] || [];
    const hasPhF = (() => { for (const _ in (master.phF || {})) return true; return false; })();
    const ph = hasPhF ? ((master.phF || {})[it.pk] || []) : m;   // มีไฟล์ Phase ที่อัปโหลดแล้ว → ใช้เฉพาะไฟล์นั้น (PK ที่ไม่อยู่ในไฟล์ = ไม่มี Phase = New)
    let a = parsePhase(it.pAm || ph[0]), d = parsePhase(it.pDm || ph[1]), f = parsePhase(it.pFm || ph[2]);
    // ไม่มีเฟสในไฟล์ Phase → เช็คจากรายการตรวจสอบประจำวันว่าเคยมี PK นี้เข้ามาแล้วหรือไม่ (เคย = ไม่ใช่ New, ใช้เฟสล่าสุดที่เคยใช้)
    let sn = null;
    if (!a.raw && !d.raw && !f.raw && Core.seenFn) { sn = Core.seenFn(it.pk); if (sn) { a = parsePhase(sn.pa); d = parsePhase(sn.pd); f = parsePhase(sn.pf); } }
    it.seenBefore = !!sn;
    const anyPhase = !!(a.raw || d.raw || f.raw);
    it.autoNew = !anyPhase && !sn;
    it.isNew = it.newManual === 'New' ? true : it.newManual === '-' ? false : it.autoNew;
    it.build = buildOf(it.pack);
    if (!it._id) it._id = newId();
    // Type PK: กรอกเอง > อ่านจากชื่อ (ข้อความหลัง ;) > ที่เคยกรอกไว้ของ PK code เดียวกัน
    it.type = s(it.typeManual).toUpperCase() || typePk(it.name) || s((master.typ || {})[it.pk]);
    it.mrp = it.mrpManual || it.mrpExport || s(m[5]) || '';
    it.approver = master.mrp[it.mrp] || '';
    it.pA = a; it.pD = d; it.pF = f;
    if (it.isNew) { const one = () => ({ raw: '1', n: 1, rv: false }); if (!a.raw) it.pA = one(); if (!d.raw) it.pD = one(); if (!f.raw) it.pF = one(); }
    it.newTxt = it.isNew ? 'New' : '-';
    it.oldCode = s(m[3]) || '';
    it.halal = it.isNew ? '-' : (s(m[4]) || '-');
    it.ssl = isSSL(it.pack);
    it.brand = s(it.pk).slice(3, 6).toUpperCase();
    return it;
  }

  /* คิวถัดไป: คนแรกที่มาและติ๊ก Appearance ต่อจากคนที่ได้ล่าสุด (วนตามลำดับรายชื่อ) */
  function nextInQueue(roster, last) {
    const n = roster.length; if (!roster.some(p => p.app)) return '';
    const start = roster.findIndex(p => p.name === last);
    for (let k = 1; k <= n; k++) { const p = roster[(start + k + n) % n]; if (p.app && p.present) return p.name; }
    return '';
  }

  /* ---------- แจกเป้า ---------- */
  function distribute(poolIn, cfgIn, rosterIn, lastQueue, lastSsl) {
    const cfg = Object.assign({}, DEFAULT_CFG, cfgIn);
    const items = poolIn.map(x => x); // อ้างอิง object เดิม (ผลลัพธ์เขียนลงใน field ของ item)
    const key = sessKey(cfg.date, cfg.half);
    const nxt = nextSession(cfg.date, cfg.half);
    const nxtKey = sessKey(nxt.date, nxt.half);
    const warnings = [];
    const carryRemark = `ค้าง ${dm(cfg.date)} ${cfg.half}`;

    // ล้างผลเดิม
    for (const it of items) {
      if (it._sslCarried) { it.sslDone = false; it.notBefore = ''; if (/^SSL ยกไป/.test(it.remark || '')) it.remark = ''; it._sslCarried = false; }
      it.app = ''; it.dim = ''; it.fun = ''; it.status = ''; it.flags = [];
    }
    const held = items.filter(it => it.notBefore && it.notBefore > key);
    held.forEach(it => { it.status = 'held'; });
    const pool = items.filter(it => !(it.notBefore && it.notBefore > key));

    const roster = rosterIn.filter(p => p.present);
    const appPeople = roster.filter(p => p.app).map(p => ({
      name: p.name, base: p.cap || cfg.appCap, n: 0, omi: false, types: {},
    }));

    const cands = [];
    for (const it of pool) {
      const allFive = !it.isNew && it.pA.n === 5 && it.pD.n === 5 && it.pF.n === 5;
      if (allFive) {
        it.status = 'approver';
        it.app = it.approver || '';
        it.dim = '-'; it.fun = '-';
        if (!it.approver) warnings.push(`Batch ${it.batch}: Phase 5 ทั้ง 3 part แต่ไม่มีชื่อ approved (MRP ${it.mrp || 'ว่าง'})`);
        continue;
      }
      if (it.ssl && !it.sslDone && it.sslNow !== 'now') {
        it.status = 'ssl'; it.sslDone = true; it._sslCarried = true; it.notBefore = nxtKey;
        if (!it.remark) it.remark = `SSL ยกไป${nxt.half}${dm(nxt.date)}`;
        continue;
      }
      cands.push(it);
    }
    // approver ที่ได้ Phase 5 นับโควตา (ถ้าเปิด)
    if (cfg.countP5ToCap) {
      for (const it of pool) if (it.status === 'approver') {
        const p = appPeople.find(x => x.name === it.app);
        if (p) p.n++;
      }
    }

    const isUrgent = it => !!s(it.urgent);
    const isOmi = it => cfg.omiBrands.includes(it.brand) && (!(cfg.omiTypes || []).length || cfg.omiTypes.includes(it.type));
    const isElf = it => cfg.elfBrands.includes(it.brand);
    const tier = it => (isUrgent(it) ? 0 : isElf(it) ? 1 : it.isNew ? 2 : 3);
    cands.sort((a, b) =>
      tier(a) - tier(b) || phaseRank(a.pA) - phaseRank(b.pA) ||
      (a.created || '').localeCompare(b.created || '') || a.batch.localeCompare(b.batch));

    const n = appPeople.length;
    let ptr = 0;
    if (n) {
      const nx = nextInQueue(rosterIn, lastQueue);
      const i = appPeople.findIndex(p => p.name === nx);
      if (i >= 0) ptr = i;
    }
    let newLast = lastQueue || '';
    const cap = p => (p.omi ? Math.min(p.base, cfg.omiCap) : p.base);
    const canTake = (p, it) => (isOmi(it) ? p.n + 1 <= Math.min(p.base, cfg.omiCap) : p.n + 1 <= cap(p));
    const give = (p, it) => {
      it.app = p.name; it.status = 'assigned'; p.n++;
      if (isOmi(it)) p.omi = true;
      p.types[it.type] = (p.types[it.type] || 0) + 1;
    };

    // ครบโควตา: ห้ามค้างตัวเร่ง / ELF → สลับกับรายการอื่น (ค้างตัวอื่นแทน) หรือแจกเพิ่มเกินโควตา ตาม cfg.fullPolicy
    const victimFor = p => items.filter(v => v.status === 'assigned' && v.app === p.name && !isUrgent(v) && !isElf(v) && !v.forceApp)
      .sort((a, b) => tier(b) - tier(a) || (b.created || '').localeCompare(a.created || '') || b.batch.localeCompare(a.batch))[0];
    const carryVictim = (v, p) => { v.status = 'carry'; v.app = ''; v.remark = (!v.remark || /^ค้าง/.test(v.remark)) ? carryRemark : v.remark; v.flags.push('ค้างเพราะสลับ'); p.n--; };
    const swapFor = () => { for (const p of appPeople.slice().sort((x, y) => y.n - x.n)) { const v = victimFor(p); if (v) { carryVictim(v, p); return p; } } return null; };
    const forced = cands.filter(it => it.forceTarget || (it.forceApp && appPeople.some(p => p.name === it.forceApp)));
    for (const it of cands) {
      if (!n) break;
      if (forced.includes(it) || it.ssl) continue;
      let chosen = null;
      if (isUrgent(it) || isOmi(it)) {
        for (let k = 0; k < n; k++) {
          const i = (ptr + k) % n;
          if (canTake(appPeople[i], it)) { chosen = appPeople[i]; ptr = (i + 1) % n; newLast = chosen.name; break; }
        }
        it.flags.push(isUrgent(it) ? 'เร่ง-ตามคิว' : 'OMI-ตามคิว');
      } else {
        const el = appPeople.filter(p => canTake(p, it));
        if (el.length) {
          const minN = Math.min(...el.map(p => p.n));
          const bal = el.filter(p => p.n <= minN + 1);
          bal.sort((x, y) => (x.types[it.type] || 0) - (y.types[it.type] || 0) || x.n - y.n ||
            appPeople.indexOf(x) - appPeople.indexOf(y));
          chosen = bal[0];
        }
      }
      if (!chosen && (isUrgent(it) || isElf(it))) {
        chosen = (cfg.fullPolicy === 'swap' && swapFor()) || appPeople.slice().sort((x, y) => x.n - y.n)[0];
        it.flags.push('เกินโควตา-ห้ามค้าง');
      }
      if (chosen) give(chosen, it);
      else { it.status = 'carry'; it.remark = (!it.remark || /^ค้าง/.test(it.remark)) ? carryRemark : it.remark; }
    }
    if (!n) cands.forEach(it => { it.status = 'carry'; it.remark = (!it.remark || /^ค้าง/.test(it.remark)) ? carryRemark : it.remark; });
    if (!n && cands.length) warnings.push('ไม่มีผู้ตรวจ Appearance ที่มาในรอบนี้ ทุกรายการจึงค้าง');

    // ---- SSL: แจกตามคิว SSL ต่อรอบไม่เกิน sslMaxPeople คน (จำนวนคนตามปริมาณงาน) · ข้ามคนที่มีตัวเร่งที่ไม่ใช่ SSL หรือคนที่ติ๊กข้ามคิว SSL ----
    let newLastSsl = lastSsl || '';
    const sslItems = cands.filter(it => it.ssl && !forced.includes(it));
    if (sslItems.length && n) {
      const maxP = Math.max(1, cfg.sslMaxPeople || 4), per = Math.max(1, cfg.sslPerPerson || 3);
      const need = Math.min(maxP, Math.ceil(sslItems.length / per));
      let st = appPeople.findIndex(p => p.name === nextInQueue(rosterIn, lastSsl)); if (st < 0) st = 0;
      const ring = appPeople.map((_, k) => appPeople[(st + k) % n]);
      const skipP = p => { const r = rosterIn.find(x => x.name === p.name); return !!(r && r.sslSkip) || items.some(v => v.status === 'assigned' && v.app === p.name && isUrgent(v) && !v.ssl); };
      let picked = ring.filter(p => !skipP(p)).slice(0, need);
      if (!picked.length) { picked = ring.slice(0, need); warnings.push('ทุกคนมีตัวเร่ง/ข้ามคิว SSL จึงแจก SSL ตามคิวปกติ'); }
      sslItems.forEach((it, k) => {
        let p = null;
        for (let j = 0; j < picked.length; j++) { const c = picked[(k + j) % picked.length]; if (canTake(c, it)) { p = c; break; } }
        if (!p && (isUrgent(it) || isElf(it))) p = picked[k % picked.length];
        if (p) { give(p, it); it.flags.push('SSL-ตามคิว'); } else { it.status = 'carry'; it.remark = (!it.remark || /^ค้าง/.test(it.remark)) ? carryRemark : it.remark; }
      });
      const lastIdx = ring.indexOf(picked[picked.length - 1]), fsk = ring.findIndex(skipP);
      newLastSsl = (fsk >= 0 && fsk < lastIdx) ? (fsk > 0 ? ring[fsk - 1].name : (lastSsl || '')) : picked[picked.length - 1].name;
    }
    for (const it of forced) {
      let p = null;
      if (it.forceTarget) {
        const v = items.find(x => x.batch === it.forceTarget && x.status === 'assigned' && !isUrgent(x) && !isElf(x));
        if (v) { p = appPeople.find(x => x.name === v.app); if (p) carryVictim(v, p); }
      } else {
        p = appPeople.find(x => x.name === it.forceApp);
        if (p && it.forceMode === 'swap') { const v = victimFor(p); if (v) carryVictim(v, p); }
      }
      if (!p) continue;
      give(p, it); it.flags.push(it.forceTarget ? 'สลับกับ ' + it.forceTarget : it.forceMode === 'swap' ? 'สลับ' : 'แจกเพิ่ม');
    }
    // ---- Dimension / Function ----
    // กลุ่ม 1 (Type อื่นทั้งหมดที่ไม่ใช่กลุ่ม 2 / 3): Dimension = ผู้ตรวจที่ติ๊ก Dimension, Function = ผู้ตรวจที่ติ๊ก Function กลุ่ม 1
    // กลุ่ม 2 (STK, DISPLAY, CARD, TAMPER SEAL, PAPER, LABEL): Dimension = คนเดียวกับ Appearance, Function = ผู้ตรวจที่ติ๊ก Function กลุ่ม 2
    // กลุ่ม 3 (BOX, PARTITION): Dimension / Function = คนเดียวกับ Appearance
    const groupOf = t => (cfg.g3Types.includes(t) ? 3 : cfg.g2Types.includes(t) ? 2 : 1);
    const DF_LABEL = { dim: 'Dimension', fun1: 'Function กลุ่ม 1', fun2: 'Function กลุ่ม 2' };
    const load = { dim: {}, fun1: {}, fun2: {} };
    for (const [field, pk] of [['dim', 'pD'], ['fun', 'pF']]) {
      for (const it of items.filter(x => x.status === 'assigned')) {
        const ph = it[pk];
        const g = groupOf(it.type);
        if (!it.isNew && ph.n === 0) { it[field] = '-'; continue; }
        if (cfg.dfSkip5 && !it.isNew && ph.n === 5) { it[field] = '-'; continue; }
        if (g === 3 || (g === 2 && field === 'dim')) { it[field] = it.app; continue; }
        const ek = field === 'dim' ? 'dim' : (g === 2 ? 'fun2' : 'fun1');
        const el = roster.filter(p => p.df && p.df[ek]);
        if (!el.length) { it[field] = ''; it.flags.push(`ไม่มีผู้ตรวจ ${DF_LABEL[ek]}`); continue; }
        const L = load[ek];
        const st = p => (L[p.name] = L[p.name] || { n: 0, types: {} });
        const minN = Math.min(...el.map(p => st(p).n));
        const bal = el.filter(p => st(p).n <= minN + 1);
        bal.sort((x, y) => (st(x).types[it.type] || 0) - (st(y).types[it.type] || 0) || st(x).n - st(y).n ||
          roster.indexOf(x) - roster.indexOf(y));
        const p = bal[0];
        it[field] = p.name; st(p).n++; st(p).types[it.type] = (st(p).types[it.type] || 0) + 1;
      }
    }
    const missingDF = items.filter(x => x.status === 'assigned' && (x.dim === '' || x.fun === '')).length;
    if (missingDF) warnings.push(`${missingDF} รายการยังไม่มีผู้ตรวจ Dimension/Function (ยังไม่ได้ติ๊กผู้ตรวจ Dimension / Function กลุ่ม 1 / Function กลุ่ม 2 ในหน้าผู้ตรวจ)`);

    for (const x of items) x.nextSess = (x.status === 'carry' || x.status === 'ssl') ? { date: nxt.date, half: nxt.half } : null;
    return { items, cands, held, warnings, lastQueue: newLast, lastSsl: newLastSsl };
  }

  /* ---------- สรุปรายคน ---------- */
  function perPerson(items) {
    const by = {};
    const add = (name, role, it) => {
      if (!name || name === '-') return;
      (by[name] = by[name] || { app: [], dim: [], fun: [] })[role].push(it);
    };
    for (const it of items) {
      if (it.status !== 'assigned' && it.status !== 'approver') continue;
      add(it.app, 'app', it); add(it.dim, 'dim', it); add(it.fun, 'fun', it);
    }
    return by;
  }

  return { DEFAULT_CFG, typePk, buildOf, isSSL, isPT, parsePhase, phaseRank, parseDate, dmy, dm, nextSession, sessKey,
    nextWorkday, nextInQueue, parseExport, filterNew, enrich, distribute, perPerson };
})();

  const m = S.master, cur = m.pk[o.pk] || blank();
  const fillOnly = !o.ts || !!(m.phImp && o.ts <= m.phImp);   // ค่าที่เรียนรู้ก่อนอัปโหลดไฟล์ Phase ห้ามทับไฟล์
  [['a', 0], ['d', 1], ['f', 2], ['old', 3], ['halal', 4], ['mrp', 5]].forEach(([k, i]) => { if (o[k] && (!fillOnly || !cur[i]) && !(i < 3 && m.phF && m.phF[o.pk])) cur[i] = o[k]; });

async function saveFile(name, buffer, mime = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet') {
  const blob = new Blob([buffer], { type: mime });
  try {
    const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if (dl) { await dl.save({ filename: name, data: blob }); toast('บันทึกไฟล์แล้ว'); return; }
  } catch (e) { if (e && e.code === 'declined') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

const escX = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function setCell(xml, ref, val) {
  const re = new RegExp('<c r="' + ref + '"([^>]*?)(?:/>|>[\\s\\S]*?</c>)');
  return xml.replace(re, (m, a) => {
    const s = (a.match(/ s="\d+"/) || [''])[0];
    if (val === '' || val == null) return `<c r="${ref}"${s}/>`;
    if (typeof val === 'number') return `<c r="${ref}"${s}><v>${val}</v></c>`;
    return `<c r="${ref}"${s} t="inlineStr"><is><t xml:space="preserve">${escX(val)}</t></is></c>`;
  });
}
function fillSheet(xml, o) {
  const extra = Math.max(0, o.rows.length - 20);
  if (extra) {
    const tpl = xml.match(/<row r="6"[\s\S]*?<\/row>/)[0];
    xml = xml.replace(/<row r="(\d+)"/g, (s, r) => (+r >= 25 ? `<row r="${+r + extra}"` : s))
      .replace(/<c r="([A-Z]+)(\d+)"/g, (s, c, r) => (+r >= 25 ? `<c r="${c}${+r + extra}"` : s));
    let add = '';
    for (let k = 0; k < extra; k++) { const r = 25 + k; add += tpl.replace('<row r="6"', `<row r="${r}"`).replace(/<c r="([A-Z]+)6"/g, (s, c) => `<c r="${c}${r}"`); }
    xml = xml.replace(/<row r="24"[\s\S]*?<\/row>/, m => m + add)
      .replace('<dimension ref="A1:X30"/>', `<dimension ref="A1:X${30 + extra}"/>`).replace('<pageSetup ', '<pageSetup fitToHeight="0" ');
  }
  const L = 'ABCDEFGHIJKLMNOPQRSTUVWX';
  o.rows.forEach((row, i) => row.forEach((v, j) => { xml = setCell(xml, L[j] + (5 + i), v); }));
  return setCell(xml, 'V1', `วันที่ตรวจสอบ  ${o.date}`);
}

  }
  if (d.r !== undefined) {
    const p = S.roster[+d.r], k = d.k;

    S.result = null; save();
    if (k === 'present' || k.startsWith('df.')) { const nb = $('#dfNote'), m = dfMissing(); if (nb) { nb.hidden = !m.length; nb.textContent = m.length ? dfNoteText(m) : ''; } }
    return;
  }
  if (d.e !== undefined) {
    const it = S.result.items[+d.e];

      if (t.value) { const [md, nm] = t.value.split('|'); if (md === 'swapwith') { it.forceTarget = nm; it.forceApp = ''; } else { it.forceApp = nm; it.forceTarget = ''; } it.forceMode = md; runDist(); toast(`${md === 'swapwith' ? 'สลับกับ' : md === 'swap' ? 'สลับ' : 'แจกเพิ่ม'} Batch ${it.batch} ${md === 'swapwith' ? nm : 'ให้ ' + nm} แล้ว (แจกใหม่ทั้งรอบ · ค่าที่แก้มือในตารางผลจะถูกคำนวณใหม่)`, 6000); }

  }

  if (t.id && t.id.startsWith('c_')) {
    const k = t.id.slice(2), list = v => v.split(',').map(x => x.trim().toUpperCase()).filter(Boolean);

    else if (['omiBrands', 'omiTypes', 'elfBrands', 'g2Types', 'g3Types'].includes(k)) S.cfg[k] = list(t.value);
